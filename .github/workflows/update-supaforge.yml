name: Update SupaForge

# The plugin runs an exact SupaForge version, so the code that installs is
# the code that was reviewed. This moves it to each new release.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin the latest release
        run: |
          latest=$(npm view @akal/supaforge version)
          if ! printf '%s' "$latest" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::unexpected version from npm: $latest"; exit 1
          fi
          node - "$latest" <<'JS'
          const fs = require('node:fs')
          const latest = process.argv[2]
          const mcpPath = 'plugins/supaforge/.mcp.json'
          const mcp = JSON.parse(fs.readFileSync(mcpPath, 'utf8'))
          const args = mcp.mcpServers.supaforge.args
          const i = args.findIndex(a => a.startsWith('@akal/supaforge@'))
          if (i < 0) throw new Error('no pinned @akal/supaforge in .mcp.json')
          if (args[i] === `@akal/supaforge@${latest}`) { console.log(`already on ${latest}`); process.exit(0) }
          args[i] = `@akal/supaforge@${latest}`
          fs.writeFileSync(mcpPath, JSON.stringify(mcp, null, 2) + '\n')
          const pluginPath = 'plugins/supaforge/.claude-plugin/plugin.json'
          const plugin = JSON.parse(fs.readFileSync(pluginPath, 'utf8'))
          const [maj, min, patch] = plugin.version.split('.').map(Number)
          plugin.version = `${maj}.${min}.${patch + 1}`
          fs.writeFileSync(pluginPath, JSON.stringify(plugin, null, 2) + '\n')
          console.log(`pinned ${latest}, plugin ${plugin.version}`)
          JS
      - name: Commit
        run: |
          git diff --quiet && exit 0
          latest=$(npm view @akal/supaforge version)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "supaforge: run $latest"
          git push
