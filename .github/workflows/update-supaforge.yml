name: Update SupaForge

# The plugin installs an exact SupaForge version from its lockfile, so the
# code that installs is the code that was reviewed. This moves it, and the
# lockfile, to each new release.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin the latest release
        run: |
          latest=$(npm view @akal/supaforge version)
          if ! printf '%s' "$latest" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::unexpected version from npm: $latest"; exit 1
          fi
          cd plugins/supaforge
          current=$(node -p "require('./package.json').dependencies['@akal/supaforge']")
          if [ "$current" = "$latest" ]; then echo "already on $latest"; exit 0; fi
          npm install --package-lock-only --save-exact --no-audit --no-fund "@akal/supaforge@$latest"
          node -e '
            const fs = require("node:fs"), p = ".claude-plugin/plugin.json", m = JSON.parse(fs.readFileSync(p, "utf8"))
            const [maj, min, patch] = m.version.split(".").map(Number)
            m.version = `${maj}.${min}.${patch + 1}`
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n")
            console.log(`pinned ${process.argv[1]}, plugin ${m.version}`)' "$latest"
      - name: Commit
        run: |
          git diff --quiet && exit 0
          latest=$(npm view @akal/supaforge version)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "supaforge: run $latest"
          git push
